{% load i18n %}
<h6 id="machine_state" class="d-inline align-bottom">
{% if status == 'standby' %}
  <small class="badge text-bg-success h5">{% trans 'Standby' %}</small>
{% elif status == 'disconnected' %}
  <span class="badge text-bg-secondary">{% trans 'Offline' %}</span>
{% elif status == 'enabled' %}
  <small class="badge text-bg-warning">{% trans 'Enabled' %}</small>
{% else %}
  <small class="label label-warning">{% trans 'Unknown' %}</small>
{% endif %}
</h6>
