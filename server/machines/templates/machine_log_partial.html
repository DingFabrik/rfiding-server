<div id="machine_logs" hx-swap-oob="beforeend">
    <pre data-prefix="{% now "H:i:s" %}"><code class="{% if level == 1 %}text-error{% elif level == 2 %}text-warning{% elif level == 3 %}text-success{% elif level == 4 %}text-secondary{% elif level >= 5 %}text-info{% else %}text-base-content/70{% endif %}">{{ message }}</code></pre>
</div>
