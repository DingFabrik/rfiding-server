<div class="card card-border bg-base-100 mb-3">
  <div class="card-body p-4 gap-2">
    <div class="flex items-center gap-3">
      <div class="avatar avatar-placeholder">
        <div class="bg-base-300 text-base-content w-8 rounded-full">
          <i data-lucide="user" class="w-4 h-4"></i>
        </div>
      </div>
      <div class="min-w-0">
        <div class="font-medium text-sm truncate">{{ comment.author }}</div>
        <div class="text-xs text-base-content/60">{% include 'snippets/timestamp.html' with timestamp=comment.created %}</div>
      </div>
    </div>
    <p class="text-sm m-0">{{ comment.text|linebreaksbr }}</p>
  </div>
</div>
