{% load crispy_forms_tags %}{% load i18n %}<div class="flex flex-col md:flex-row gap-4">
  <div class="flex-1">
  {% for comment in object.comments.all %}
    {% include "comment.html" %}
    {% empty %}
    <div role="alert" class="alert">
      {% trans "No comments yet." %}
    </div>
  {% endfor %}
</div>
<div class="flex-1">
    <form class="mb-3" method="post" action="{% url comment_url object.pk %}" hx-target="#comments-tab-pane" hx-swap="outerHTML">
    {% csrf_token %}
    {{ comment_form|crispy }}
    <button type="submit" class="btn btn-sm btn-primary">{% trans 'Post' %}</button>
  </form>
</div>
