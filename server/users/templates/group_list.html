{% extends base_template %}
{% load i18n %}

{% block table %}
    <thead>
        <tr>
            <th>{% trans "Name" %}</th>
        </tr>
        </thead>
{% for group in groups %}
<tr>
{% if perms.auth.modify_group %}
<td><a href="{% url "users:groups:update" group.pk %}">{{ group.name }}</a></td>
{% else %}
<td>{{ group.name }}</td>
{% endif %}
</tr>
{% endfor %}
{% endblock %}
