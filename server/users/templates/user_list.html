{% extends base_template %}
{% load i18n %}

{% block table %}
    <thead>
        <tr>
            <th>{% trans "Name" %}</th>
            <th>{% trans "E-Mail Address" %}</th>
        </tr>
        </thead>
{% for user in users %}
<tr>
{% if perms.users.modify_user %}
<td><a href="{% url "users:update" user.pk %}">{{ user.name }}</a></td>
{% else %}
<td>{{ user.name }}</td>
{% endif %}
<td>{{ user.email }}</td>
</tr>
{% endfor %}
{% endblock %}
