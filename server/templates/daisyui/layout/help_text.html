{% if field.help_text %}
    {% if help_text_inline %}
        <span id="{{ field.auto_id }}_helptext" class="block mt-1 text-xs text-base-content/60">{{ field.help_text|safe}}</span>
    {% else %}
        <p {% if field.auto_id %}id="{{ field.auto_id }}_helptext" {% endif %}class="block mt-1 text-xs text-base-content/60">{{ field.help_text|safe }}</p>
    {% endif %}
{% endif %}
