<fieldset class="fieldset border border-secondary rounded p-2 mb-3{% if fieldset.css_class %} {{ fieldset.css_class }}{% endif %}" {% if fieldset.css_id %}id="{{ fieldset.css_id }}"{% endif %}
    {{ fieldset.flat_attrs }}>
    {% if legend %}<legend class="fieldset-legend text-base px-2">{{ legend|safe }}</legend>{% endif %}
    {{ fields|safe }}
</fieldset>
