{% load i18n %}
<dialog class="modal" id="confirmDeleteModal">
  <div class="modal-box">
    <div class="flex items-start gap-3">
      <i data-lucide="trash-2" class="w-8 h-8 text-error shrink-0"></i>
      <h3 class="text-lg font-bold">{% blocktrans %}Do you really want to delete <b>{{ object }}</b>?{% endblocktrans %}</h3>
    </div>
    <p class="py-4">{% blocktrans %}Deleting an object permanently removes it and can not be undone{% endblocktrans %}</p>
    <div class="modal-action">
      <form method="dialog"><button type="button" class="btn">{% trans "No" %}</button></form>
      <form action="{% url request.resolver_match.namespace|add:':delete' object.pk %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-error">{% trans "Delete" %}</button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>{% trans "close" %}</button></form>
</dialog>
