{% load static %}
{% load i18n %}
<div class="navbar bg-base-100 border-neutral/10 sticky top-0 z-30 border-b shadow-sm gap-1">
  <div class="flex-none lg:hidden">
    <label for="sidebar-drawer" aria-label="{% trans "Open menu" %}" class="btn btn-ghost btn-circle">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </label>
  </div>
  <div class="flex-1 lg:hidden">
    <a class="btn btn-ghost px-2" href="{% url 'home' %}">
      <img src="{% static "images/logo_dark.svg" %}" alt="Logo" width="32" height="32">
    </a>
  </div>
  <div class="flex-1 hidden lg:block"></div>
  <div class="flex-none flex items-center gap-1">
    {% if space_state %}
      <a href="{% url "space:status" %}" class="badge {% if space_state.is_open %}badge-success{% else %}badge-error{% endif %} inline-flex">{{ space_state }}</a>
    {% endif %}
    <button type="button" class="btn btn-outline btn-primary btn-sm hidden md:inline-flex" data-modal-target="searchUniversalModal">
      <i data-lucide="search" class="w-4 h-4"></i> {% trans "Search" %}
      <kbd class="kbd kbd-xs gap-0.5"><i data-lucide="command" class="w-3 h-3"></i>K</kbd>
    </button>
    <button type="button" class="btn btn-ghost btn-circle md:hidden" data-modal-target="searchUniversalModal" aria-label="{% trans "Search" %}">
      <i data-lucide="search" class="w-5 h-5"></i>
    </button>

    <button
      class="btn btn-ghost btn-circle"
      popovertarget="user-menu"
      style="anchor-name:--user-menu"
      aria-label="{% trans "Account" %}">
      <i data-lucide="circle-user" class="w-5 h-5"></i>
    </button>
    <ul
      class="dropdown dropdown-end menu bg-base-100 rounded-box z-30 mt-3 w-56 p-2 shadow-lg"
      popover
      id="user-menu"
      style="position-anchor:--user-menu">
      <li class="menu-title">{{ user.name|default:user.email }}</li>
      <li><a href="{% url "users:profile" %}"><i data-lucide="settings" class="w-4 h-4"></i> {% trans "Settings" %}</a></li>
      <li>
        <form method="post" action="{% url "logout" %}">
          {% csrf_token %}
          <button type="submit"><i data-lucide="log-out" class="w-4 h-4"></i> {% trans "Sign out" %}</button>
        </form>
      </li>
    </ul>
  </div>
</div>
