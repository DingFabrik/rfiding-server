{% if object.type == "booted" %}
<i class="bi bi-rocket-takeoff-fill me-1 text-primary"></i>
{% elif object.type == "enabled" %}
<i class="bi bi-play-circle-fill me-1 text-success"></i>
{% elif object.type == "disabled" %}
<i class="bi bi-stop-circle-fill me-1 text-secondary"></i>
{% elif object.type == "unsuccessful" %}
<i class="bi bi-x-circle-fill me-1 text-danger"></i>
{% endif %}
{{ object.get_type_display }}
