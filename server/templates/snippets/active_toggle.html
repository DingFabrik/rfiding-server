<div class="clickable active_toggle" hx-get="{% url request.resolver_match.namespace|add:':toggle-active' pk=object.pk %}">
  {% if object.is_active %}
  <i data-lucide="circle-check-big" class="w-4 h-4 text-success" aria-hidden="true"></i>
  {% else %}
  <i data-lucide="circle-x" class="w-4 h-4 text-error" aria-hidden="true"></i>
  {% endif %}
  <span class="htmx-indicator loading loading-spinner loading-sm" role="status">
    <span class="sr-only">Loading...</span>
  </span>
</div>
