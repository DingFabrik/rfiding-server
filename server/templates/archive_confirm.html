{% extends "base_slim.html" %}
{% load i18n %}

{% block content %}
    <div role="alert" class="alert alert-error">
        <i data-lucide="triangle-alert" class="w-5 h-5"></i>
        <div>
            <h3 class="font-bold">{% blocktrans %}Do you really want to archive <b>{{ object }}</b>?{% endblocktrans %}</h3>
        </div>
    </div>
    <form action="" method="post" class="mt-4">
        {% csrf_token %}
        <div class="flex justify-end gap-2">
            <a href="{{ object.get_absolute_url }}" class="btn btn-sm">{% trans "No" %}</a>
            <input type="submit" value="{% trans "Archive" %}" class="btn btn-sm btn-error"/>
        </div>
    </form>
{% endblock %}
