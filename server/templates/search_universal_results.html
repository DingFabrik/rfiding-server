{% load i18n %}{% load base_extra %}<div class="max-w-full overflow-x-auto rounded-box border border-base-content/10"><table class="table table-sm">
    <tr>
        <th>{% trans "Type" %}</th>
        <th>{% trans "Name" %}</th>
        <th>{% trans "Created" %}</th>
        <th>{% trans "Updated" %}</th>
    </tr>
    {% for object in objects %}
    <tr>
        <td>{{ object|verbose_name }}</td>
        <td><a class="link" href="{{ object.get_absolute_url }}">{{ object }}</a></td>
        <td>{{ object.created }}</td>
        <td>{{ object.updated }}</td>
    </tr>
    {% endfor %}
</table></div>
