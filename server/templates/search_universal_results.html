{% load i18n %}{% load base_extra %}<table class="table table-bordered table-hover">
    <tr>
        <th>{% trans "Type" %}</th>
        <th>{% trans "Name" %}</th>
        <th>{% trans "Created" %}</th>
        <th>{% trans "Updated" %}</th>
    </tr>
    {% for object in objects %}
    <tr>
        <td>{{ object|verbose_name }}</td>
        <td><a href="{{ object.get_absolute_url }}">{{ object }}</a></td>
        <td>{{ object.created }}</td>
        <td>{{ object.updated }}</td>
    </tr>
    {% endfor %}
</table>
